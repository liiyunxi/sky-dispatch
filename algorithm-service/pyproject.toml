[project]
name = "sky-dispatch-algorithm"
version = "0.1.0"
description = "sky-dispatch 低空无人机配送调度仿真平台 —— 算法服务（A* 路径规划 + 冲突检测）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

# 注意：dev 依赖使用 PEP 735 依赖组（uv 原生支持）
[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

# 本服务是虚拟工程（virtual project），不打包安装，因此故意不写 [build-system]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
