# =============================================================================
#  sky-dispatch 本地开发依赖
#
#  用法：
#      docker compose up -d            # 启动 PostGIS + pgAdmin
#      docker compose logs -f postgis  # 看日志
#      docker compose down             # 停止（保留数据卷）
#      docker compose down -v          # 停止并删除数据（重置数据库）
#
#  启动后即可用 postgres profile 跑后端：
#      cd backend
#      mvn spring-boot:run -Dspring-boot.run.profiles=postgres
#  Flyway 会自动执行 db/migration 下的 V1、V2。
#
#  注意：这是本地开发用的"图省事"编排（密码写死在文件里、端口直接对外）。
#        生产环境请用托管数据库或独立的编排文件，并把凭据交给密钥管理服务。
# =============================================================================

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: sky-dispatch-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: sky_dispatch
      POSTGRES_USER: sky
      POSTGRES_PASSWORD: sky123456
      # 让中文排序/比较符合预期；示例数据里有不少中文名称
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
      # 首次创建数据库时自动建 PostGIS 扩展（V1 不依赖它，但提前装好省事）
      - ./db/postgis/init-extensions.sql:/docker-entrypoint-initdb.d/00-init-extensions.sql:ro
    healthcheck:
      # 健康检查通过后 pgadmin 才启动，避免第一次打开就连不上库
      test: ["CMD-SHELL", "pg_isready -U sky -d sky_dispatch"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sky-dispatch-pgadmin
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sky-dispatch.local
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      # 5050 而不是默认 80，避免和本机已有 Web 服务冲突
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin

volumes:
  postgis-data:
  pgadmin-data:
