# =============================================================================
#  postgres 环境：真实 PostgreSQL / PostGIS
#
#  准备数据库（psql 里执行）：
#    CREATE ROLE sky LOGIN PASSWORD 'sky123456';
#    CREATE DATABASE sky_dispatch OWNER sky;
#    \c sky_dispatch
#    CREATE EXTENSION IF NOT EXISTS postgis;   -- 可选，仅空间增强功能需要
#
#  启动：mvn spring-boot:run -Dspring-boot.run.profiles=postgres
#  Flyway 会自动执行 db/migration 下的 V1、V2 脚本。
# =============================================================================
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sky_dispatch}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:sky}
    password: ${DB_PASSWORD:sky123456}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: none            # 表结构由 Flyway 管理，Hibernate 不插手
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50        # 批量写入，遥测入库提速
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

sky:
  bootstrap:
    seed-demo-data: false       # 生产/联调环境使用 V2 脚本里的种子数据
